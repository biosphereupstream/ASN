<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>probe2</title>
    <style>
      body { font: 12px monospace; margin: 0; }
    </style>
  </head>
  <body>
    <pre id="out">PENDING</pre>
    <script>
      // Focused re-checks: drawer close, hamburger visibility, hero/value-prop columns.
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

      async function probeWidth(width) {
        const f = document.createElement('iframe')
        f.style.cssText = `border:0;visibility:hidden;width:${width}px;height:900px`
        f.src = '/?p2=' + Date.now()
        const loaded = new Promise((r) => f.addEventListener('load', r, { once: true }))
        document.body.appendChild(f)
        await loaded
        await sleep(2500)
        const d = f.contentDocument
        const out = { width }

        // Hero grid columns (first section's own grid)
        const heroGrid = [...d.querySelectorAll('section')][0].querySelector('.grid, [class*="grid"]')
        out.heroGridCols = heroGrid ? getComputedStyle(heroGrid).gridTemplateColumns.split(' ').length : null

        // Hamburger: visible only < lg (1024)
        const burger = [...d.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Buka menu')
        out.hamburgerVisible = burger ? getComputedStyle(burger).display !== 'none' : false

        // Top nav visible only >= lg
        const topNav = [...d.querySelectorAll('header nav')][0]
        out.topNavVisible = topNav ? getComputedStyle(topNav).display !== 'none' : null

        // Value props grid = the section containing .micon chips
        const vpSection = [...d.querySelectorAll('section')].find((s) => s.querySelector('.micon'))
        const vpGrid = vpSection ? vpSection.querySelector('.grid') : null
        out.valuePropsCols = vpGrid ? getComputedStyle(vpGrid).gridTemplateColumns.split(' ').length : null

        // Drawer close with generous wait (out-transition 200ms)
        if (width < 1024) {
          burger.click()
          await sleep(600)
          const dlg = [...d.querySelectorAll('[role="dialog"]')].pop()
          out.drawerOpens = !!dlg
          if (dlg) {
            const closeBtn = [...dlg.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Tutup menu')
            out.foundCloseBtn = !!closeBtn
            closeBtn.click()
            await sleep(900)
            out.drawerCloses = !d.querySelector('[role="dialog"]')
          }
        }

        f.remove()
        return out
      }

      async function run() {
        try {
          const results = []
          for (const w of [360, 768, 1920]) {
            results.push(await probeWidth(w))
            await sleep(300)
          }
          return { ok: true, results }
        } catch (e) {
          return { ok: false, error: String((e && e.stack) || e) }
        }
      }

      run().then((r) => {
        document.getElementById('out').textContent = JSON.stringify(r, null, 2)
        document.title = 'PROBE2-DONE'
      })
    </script>
  </body>
</html>
